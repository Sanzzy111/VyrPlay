name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: foss, ui: Mobile, arch: universal, task: FossMobileUniversal, output: fossMobileUniversal }
          - { variant: foss, ui: Mobile, arch: arm64, task: FossMobileArm64, output: fossMobileArm64 }
          - { variant: foss, ui: Mobile, arch: armeabi, task: FossMobileArmeabi, output: fossMobileArmeabi }
          - { variant: foss, ui: Mobile, arch: x86, task: FossMobileX86, output: fossMobileX86 }
          - { variant: foss, ui: Mobile, arch: x86_64, task: FossMobileX86_64, output: fossMobileX86_64 }
          - { variant: gms, ui: Mobile, arch: universal, task: GmsMobileUniversal, output: gmsMobileUniversal }
          - { variant: gms, ui: Mobile, arch: arm64, task: GmsMobileArm64, output: gmsMobileArm64 }
          - { variant: gms, ui: Mobile, arch: armeabi, task: GmsMobileArmeabi, output: gmsMobileArmeabi }
          - { variant: gms, ui: Mobile, arch: x86, task: GmsMobileX86, output: gmsMobileX86 }
          - { variant: gms, ui: Mobile, arch: x86_64, task: GmsMobileX86_64, output: gmsMobileX86_64 }
          - { variant: foss, ui: Tv, arch: universal, task: FossTvUniversal, output: fossTvUniversal }
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Decode keystores
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE" | base64 -d > keystore/debug.keystore
          echo "$RELEASE_KEYSTORE" | base64 -d > keystore/release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
    
          # LastFM API Keys
          LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}
     
          # Debug keystore (root level)
          debug.storeFile=keystore/debug.keystore
          debug.storePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          debug.keyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debug.keyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
     
          # Release keystore (root level)
          release.storeFile=keystore/release.keystore
          release.storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          release.keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          release.keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
     
          # Persistent Debug keystore
          debug.persistent.storeFile=keystore/debug.keystore
          debug.persistent.storePassword=${{ secrets.DEBUG_STORE_PASSWORD }}
          debug.persistent.keyAlias=${{ secrets.DEBUG_KEY_ALIAS }}
          debug.persistent.keyPassword=${{ secrets.DEBUG_KEY_PASSWORD }}
          EOF

      - name: Build ${{ matrix.variant }} ${{ matrix.ui }} ${{ matrix.arch }} release APK
        run: |
          sed -i 's|tinypinyin = "2.0.3"|tinypinyin = "2.0.1"|g' gradle/libs.versions.toml
          ./gradlew assemble${{ matrix.task }}Release --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ui }}-${{ matrix.variant }}-${{ matrix.arch }}-release
          path: app/build/outputs/apk/${{ matrix.output }}/release/*.apk
          if-no-files-found: error
