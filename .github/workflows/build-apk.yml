name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # bisa trigger manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (FOSS)
        run: ./gradlew assembleFossUniversalDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
